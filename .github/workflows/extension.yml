name: extension

on:
  push:
    branches: [main]
    tags: ["agentlens-v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Editor tests (real VS Code)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:editor
      - run: npm run package
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: agentlens-vsix
          path: extension/*.vsix

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/agentlens-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: agentlens-vsix
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.vsix"
